name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Los runners de GitHub usan kernel Linux 6.19+, con el que MongoDB 8.x no arranca
      # (incompatibilidad conocida de MongoDB, SERVER-121912). En CI se usa la LTS 7.0.
      MONGO_TAG: "7.0"
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar (Maven)
        run: mvn -B -DskipTests package

      - name: Levantar MariaDB, MongoDB y la API con Docker Compose
        run: docker compose up -d --build --wait

      - name: Prueba de humo del CRUD (MARIA y MONGO)
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api-docs > /dev/null && break; sleep 2; done
          bash scripts/smoke_test.sh | tee smoke.log
          if grep -qE '^\[(5|000)' smoke.log; then echo "Hay respuestas 5xx o sin conexion"; exit 1; fi

      - name: Logs de los contenedores
        if: always()
        run: docker compose logs --no-color

      - name: Apagar
        if: always()
        run: docker compose down -v
