#Loggion config
logging.level.root=WARN
spring.main.banner-mode=off
#logging.level.org.springframework=debug
logging.file.name=logs/persona.log
#Bean reference Config
# Los mappers se inyectan entre si (Persona <-> Telefono/Estudios); Spring Boot
# prohibe ciclos por defecto desde la 2.6, por eso el template habilita esto.
spring.main.allow-circular-references=true
#MariaDB Config
spring.datasource.url=jdbc:mariadb://localhost:3307/persona_db
spring.datasource.username=persona_db
spring.datasource.password=persona_db
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
#MongoDB Config
# En Spring Boot 4 las propiedades de conexion pasaron de spring.data.mongodb.* a
# spring.mongodb.* (las antiguas se ignoran). authSource=admin porque el usuario
# persona_db se crea en la base admin (scripts/persona_ddl_mongo.js).
spring.mongodb.uri=mongodb://persona_db:persona_db@localhost:27017/persona_db?authSource=admin
